name: Build 5.1 beta native installers

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 5.1.0-beta
  SOURCE_ARCHIVE: AeroMC-5.1.0-beta-source.zip
  SOURCE_SHA256: 798a877d9b0d6fb0e989eb7f706f9d9011cb1115cc25dad17a206318eb17d900

jobs:
  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure WiX Toolset 3
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1 -y
          }
      - name: Download verified beta source snapshot
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Liytles/AeroMCServerPanel/releases/download/v${env:VERSION}/${env:SOURCE_ARCHIVE}" -OutFile source.zip
          if ((Get-FileHash source.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne "${env:SOURCE_SHA256}") { throw "Source archive checksum mismatch." }
          Expand-Archive source.zip -DestinationPath source
      - name: Build installer
        shell: pwsh
        working-directory: source
        run: ./scripts/package-windows.ps1
      - name: Attach installer to beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload -R "Liytles/AeroMCServerPanel" "v${env:VERSION}" source/release/windows/*.exe source/release/windows/*.sha256 --clobber

  macos:
    name: macOS installer (.dmg)
    runs-on: macos-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download verified beta source snapshot
        shell: bash
        run: |
          curl --fail --location --silent --show-error "https://github.com/Liytles/AeroMCServerPanel/releases/download/v${VERSION}/${SOURCE_ARCHIVE}" --output source.zip
          echo "${SOURCE_SHA256}  source.zip" | shasum -a 256 -c -
          unzip -q source.zip -d source
      - name: Build installer
        shell: bash
        working-directory: source
        run: ./scripts/package-macos.sh
      - name: Attach installer to beta release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload -R "Liytles/AeroMCServerPanel" "v${VERSION}" source/release/macos/*.dmg source/release/macos/*.sha256 --clobber

  linux:
    name: Linux installer (.deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Download verified beta source snapshot
        shell: bash
        run: |
          curl --fail --location --silent --show-error "https://github.com/Liytles/AeroMCServerPanel/releases/download/v${VERSION}/${SOURCE_ARCHIVE}" --output source.zip
          echo "${SOURCE_SHA256}  source.zip" | sha256sum -c -
          unzip -q source.zip -d source
      - name: Build installer
        shell: bash
        working-directory: source
        run: ./scripts/package-linux.sh
      - name: Attach installer to beta release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload -R "Liytles/AeroMCServerPanel" "v${VERSION}" source/release/linux/*.deb source/release/linux/*.sha256 --clobber
