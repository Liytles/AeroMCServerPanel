name: Build V5 native installers

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 5.0.0
  SOURCE_ARCHIVE: AeroMC-5.0.0-source.zip
  SOURCE_SHA256: 224501de51f08aac705aa941c66ec8f8649df376e543419c789764ad9e48bbde

jobs:
  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download the V5 source snapshot
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Liytles/AeroMCServerPanel/releases/download/v${env:VERSION}/${env:SOURCE_ARCHIVE}" -OutFile source.zip
          if ((Get-FileHash source.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne "${env:SOURCE_SHA256}") { throw "Source archive checksum mismatch." }
          Expand-Archive source.zip -DestinationPath source

      - name: Build installer
        shell: pwsh
        working-directory: source
        run: ./scripts/package-windows.ps1

      - name: Attach installer to V5 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload -R "Liytles/AeroMCServerPanel" "v${env:VERSION}" source/release/windows/*.exe source/release/windows/*.sha256 source/release/windows/SHA256SUMS.txt --clobber

  macos:
    name: macOS installer (.dmg)
    runs-on: macos-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download the V5 source snapshot
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/Liytles/AeroMCServerPanel/releases/download/v${VERSION}/${SOURCE_ARCHIVE}" \
            --output source.zip
          echo "${SOURCE_SHA256}  source.zip" | shasum -a 256 -c -
          unzip -q source.zip -d source

      - name: Build installer
        shell: bash
        working-directory: source
        run: ./scripts/package-macos.sh

      - name: Attach installer to V5 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload -R "Liytles/AeroMCServerPanel" "v${VERSION}" source/release/macos/*.dmg source/release/macos/*.sha256 source/release/macos/SHA256SUMS.txt --clobber
